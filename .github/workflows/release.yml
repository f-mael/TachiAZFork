name: Publish Release

# Publishes a GitHub release whenever the versionName in app/build.gradle changes.
# The release ships two APKs (Android 5/6 + Android 7+); the in-app updater picks
# the one matching each install via the "android5"/"android7" marker in the file name.
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - 'app/build.gradle'

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read versionName
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check whether release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.version }} already exists; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and publish
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_TEXT: ${{ secrets.GOOGLE_SERVICES_TEXT }}
        run: |
          if [ -n "$GOOGLE_SERVICES_TEXT" ]; then
            echo "$GOOGLE_SERVICES_TEXT" > app/google-services.json
          else
            echo '{"project_info":{"project_number":"1234567890","project_id":"tachiazfork-mock","storage_bucket":"tachiazfork-mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:mockappiddummystring","android_client_info":{"package_name":"eu.kanade.tachiyomi.tachiazfork"}},"oauth_client":[],"api_key":[{"current_key":"fake_api_key_for_mock_build_only"}],"services":{"analytics_service":{"status":1},"appinvite_service":{"status":1,"other_platform_oauth_client":[]},"ads_service":{"status":1}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Check for signing key
        id: check_signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "has_signing_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing_key=false" >> "$GITHUB_OUTPUT"
          fi

      # Builds both API-level variants from the same code:
      #   standardApi21Release -> Android 5/6 (minSdk 21)
      #   standardApi24Release -> Android 7+  (minSdk 24)
      - name: Build APKs
        uses: gradle/gradle-command-action@v2
        with:
          arguments: assembleStandardApi21Release assembleStandardApi24Release

      - name: Setup Android SDK
        if: steps.check_signing.outputs.has_signing_key == 'true'
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3" || true

      - name: Sign Android 5/6 (api21) release
        id: sign_android5
        if: steps.check_signing.outputs.has_signing_key == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/standardApi21/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Android 7+ (api24) release
        id: sign_android7
        if: steps.check_signing.outputs.has_signing_key == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/standardApi24/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          SIGNED_7="${{ steps.sign_android7.outputs.signedReleaseFile }}"
          SIGNED_5="${{ steps.sign_android5.outputs.signedReleaseFile }}"
          if [ -n "$SIGNED_7" ] && [ -f "$SIGNED_7" ]; then
            cp "$SIGNED_7" "release-assets/TachiAZFork-${VERSION}-android7.apk"
          else
            cp app/build/outputs/apk/standardApi24/release/*.apk "release-assets/TachiAZFork-${VERSION}-android7.apk"
          fi
          if [ -n "$SIGNED_5" ] && [ -f "$SIGNED_5" ]; then
            cp "$SIGNED_5" "release-assets/TachiAZFork-${VERSION}-legacy-android5.apk"
          else
            cp app/build/outputs/apk/standardApi21/release/*.apk "release-assets/TachiAZFork-${VERSION}-legacy-android5.apk"
          fi
          ls -l release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            release-assets/TachiAZFork-${VERSION}-android7.apk \
            release-assets/TachiAZFork-${VERSION}-legacy-android5.apk
