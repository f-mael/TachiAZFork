name: Android Master CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - 'app/**'
      - 'core-model/**'
      - 'core-database/**'
      - 'core-domain/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

jobs:
  apk:
    name: Generate APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1

      - name: Write google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_TEXT }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_TEXT }}' > app/google-services.json
          else
            echo '{"project_info":{"project_number":"1234567890","project_id":"tachiazfork-mock","storage_bucket":"tachiazfork-mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:mockappiddummystring","android_client_info":{"package_name":"eu.kanade.tachiyomi.tachiazfork"}},"oauth_client":[],"api_key":[{"current_key":"fake_api_key_for_mock_build_only"}],"services":{"analytics_service":{"status":1},"appinvite_service":{"status":1,"other_platform_oauth_client":[]},"ads_service":{"status":1}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      # Builds both API-level variants from the same code:
      #   standardApi21Release -> Android 5/6 (minSdk 21)
      #   standardApi24Release -> Android 7+  (minSdk 24)
      - name: Build APKs
        uses: gradle/gradle-command-action@v2
        with:
          arguments: assembleStandardApi21Release assembleStandardApi24Release

      - name: Setup Android SDK
        if: ${{ secrets.SIGNING_KEY != '' }}
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3" || true

      - name: Sign Android 5/6 (api21) release
        id: sign_android5
        if: ${{ secrets.SIGNING_KEY != '' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/standardApi21/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Android 7+ (api24) release
        id: sign_android7
        if: ${{ secrets.SIGNING_KEY != '' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/standardApi24/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK outputs
        run: |
          mkdir -p apk-output
          if [ -n "${{ steps.sign_android7.outputs.signedReleaseFile }}" ] && [ -f "${{ steps.sign_android7.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_android7.outputs.signedReleaseFile }}" apk-output/TachiAZFork-android7.apk
          else
            cp app/build/outputs/apk/standardApi24/release/*.apk apk-output/TachiAZFork-android7.apk
          fi
          if [ -n "${{ steps.sign_android5.outputs.signedReleaseFile }}" ] && [ -f "${{ steps.sign_android5.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_android5.outputs.signedReleaseFile }}" apk-output/TachiAZFork-android5.apk
          else
            cp app/build/outputs/apk/standardApi21/release/*.apk apk-output/TachiAZFork-android5.apk
          fi

      - name: Upload Android 5/6 APK (minSdk 21)
        uses: actions/upload-artifact@v4
        with:
          name: TachiAZFork-android5-${{ github.sha }}
          path: apk-output/TachiAZFork-android5.apk

      - name: Upload Android 7+ APK (minSdk 24)
        uses: actions/upload-artifact@v4
        with:
          name: TachiAZFork-android7-${{ github.sha }}
          path: apk-output/TachiAZFork-android7.apk
